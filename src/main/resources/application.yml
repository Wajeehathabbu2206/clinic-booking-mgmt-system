spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: medibook-backend

  profiles:
    active: dev

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

# Application-level constants used across modules
medibook:
  email:
    provider: ${EMAIL_PROVIDER:brevo}
    api-key: ${BREVO_API_KEY:}
    sender-email: ${EMAIL_SENDER_ADDRESS:}
    sender-name: ${EMAIL_SENDER_NAME:MediBook}
    base-url: ${BREVO_BASE_URL:https://api.brevo.com}
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    full-name: ${ADMIN_FULL_NAME:System Administrator}

logging:
  level:
    com.medibook: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

  
